<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Miembros - Proyecto Magnes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .hidden {
        display: none;
      }
      /* Estilos para los sliders de dos tonos */
      .slider-container {
        position: relative;
        width: 100%;
        height: 20px;
      }
      .slider-track-bg {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 100%;
          height: 8px;
          background: linear-gradient(to right, #8b5cf6 0%, #8b5cf6 50%, #fcd34d 50%, #fcd34d 100%);
          border-radius: 4px;
          z-index: 0;
      }
      .slider-dots {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 1;
      }
      .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
      }
      input[type="range"] {
          -webkit-appearance: none;
          appearance: none;
          background: transparent;
          cursor: pointer;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 2;
      }

      /* Estilo de la manija (thumb) para WebKit */
      input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          height: 20px;
          width: 20px;
          background-color: #ffffff;
          border: 2px solid #6b7280;
          border-radius: 50%;
          margin-top: -6px;
      }

      /* Estilo de la pista (track) para Firefox */
      input[type="range"]::-moz-range-track {
          height: 8px;
          background: transparent;
      }

      /* Estilo de la manija (thumb) para Firefox */
      input[type="range"]::-moz-range-thumb {
          height: 20px;
          width: 20px;
          background-color: #ffffff;
          border: 2px solid #6b7280;
          border-radius: 50%;
      }

      /* Estilos para la tabla */
      .metrics-table th, .metrics-table td {
          padding: 0.75rem;
          text-align: center;
      }
      .metrics-table th {
          background-color: #f3f4f6;
          font-weight: 600;
          border-bottom: 2px solid #e5e7eb;
      }
      .metrics-table td {
          border-bottom: 1px solid #e5e7eb;
      }
      .metrics-table tr:last-child td {
          border-bottom: none;
      }
      
      /* Estilos para los nuevos índices */
      .quality-box {
          padding: 0.25rem 0.75rem;
          border-radius: 9999px;
          font-weight: 600;
          color: white;
          font-size: 0.75rem;
          margin-bottom: 0.5rem;
          display: inline-block;
      }
      .quality-box.excellent { background-color: #10b981; } /* verde */
      .quality-box.good { background-color: #3b82f6; } /* azul */
      .quality-box.average { background-color: #eab308; } /* amarillo */
      .quality-box.poor { background-color: #ef4444; } /* rojo */

      /* =========================================================
         ESTILOS AVANZADOS PARA EL INFORME PDF (PROYECTO MAGNES)
         ========================================================= */
      .report-container {
          font-family: 'Inter', sans-serif;
          color: #1f2937;
          font-size: 9.5px;
          line-height: 1.45;
          padding: 10px 15px;
      }

      .report-header {
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          border-bottom: 2px solid #2563eb;
          padding-bottom: 10px;
          margin-bottom: 16px;
      }

      .report-title {
          font-size: 18px;
          font-weight: 700;
          color: #111827;
          margin: 0;
      }

      .report-subtitle {
          color: #2563eb;
          font-size: 9px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin: 2px 0 0 0;
      }

      .report-meta {
          text-align: right;
          font-size: 8.5px;
          color: #6b7280;
      }

      .report-section-title {
          font-size: 12.5px;
          font-weight: 700;
          color: #1e3a8a;
          border-left: 3px solid #2563eb;
          padding-left: 8px;
          margin-top: 18px;
          margin-bottom: 10px;
          page-break-after: avoid;
      }

      .report-intro-box {
          background-color: #f8fafc;
          border: 1px solid #e2e8f0;
          border-radius: 6px;
          padding: 10px 12px;
          margin-bottom: 14px;
          color: #334155;
          font-size: 8.8px;
      }

      /* Grid de KPIs del equipo */
      .report-kpi-grid {
          display: flex;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 14px;
          page-break-inside: avoid;
      }

      .report-kpi-card {
          flex: 1;
          background: #ffffff;
          border: 1px solid #e5e7eb;
          border-radius: 6px;
          padding: 10px;
          text-align: center;
      }

      .report-kpi-label {
          font-size: 9px;
          font-weight: 700;
          color: #4b5563;
          text-transform: uppercase;
          margin-bottom: 4px;
      }

      .report-kpi-value {
          font-size: 15px;
          font-weight: 700;
          color: #111827;
          margin-bottom: 4px;
      }

      .report-badge {
          display: inline-block;
          padding: 2px 8px;
          border-radius: 9999px;
          font-size: 8px;
          font-weight: 600;
          color: #ffffff;
      }

      .badge-excellent { background-color: #10b981; }
      .badge-good { background-color: #3b82f6; }
      .badge-average { background-color: #eab308; color: #1f2937; }
      .badge-poor { background-color: #ef4444; }
      .badge-alert { background-color: #dc2626; }
      .badge-neutral { background-color: #6b7280; }

      /* Tarjetas generales y prevención de cortes entre páginas */
      .report-card {
          margin-bottom: 10px;
          padding: 10px 12px;
          border: 1px solid #e5e7eb;
          border-radius: 6px;
          background-color: #f9fafb;
          page-break-inside: avoid;
          break-inside: avoid;
      }

      .report-card-synergy {
          background-color: #eff6ff;
          border-color: #bfdbfe;
      }

      .report-card-alert {
          background-color: #fef2f2;
          border-color: #fecaca;
      }

      .report-card-title {
          font-size: 10.5px;
          font-weight: 700;
          margin: 0 0 5px 0;
          color: #1f2937;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }

      /* Barras de espectro visual (-3 a +3) para miembros */
      .metric-bar-row {
          display: flex;
          align-items: center;
          margin-top: 5px;
          font-size: 8.5px;
      }

      .metric-bar-label {
          width: 115px;
          font-weight: 600;
          color: #374151;
      }

      .metric-bar-track {
          flex: 1;
          height: 7px;
          background-color: #e5e7eb;
          border-radius: 4px;
          position: relative;
          margin: 0 10px;
          overflow: hidden;
      }

      .metric-bar-center {
          position: absolute;
          left: 50%;
          top: 0;
          bottom: 0;
          width: 1px;
          background-color: #6b7280;
          z-index: 2;
      }

      .metric-bar-fill {
          position: absolute;
          top: 0;
          bottom: 0;
          border-radius: 2px;
      }

      .metric-bar-text {
          width: 125px;
          text-align: right;
          color: #4b5563;
      }

      .report-footer {
          margin-top: 20px;
          padding-top: 8px;
          border-top: 1px solid #e5e7eb;
          text-align: center;
          font-size: 8px;
          color: #9ca3af;
          page-break-inside: avoid;
      }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Contenedor principal de la aplicación -->
    <div id="app-container" class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-2xl transition-all duration-300 transform scale-100">

        <!-- Sección de Bienvenida -->
        <div id="welcome-section" class="transition-opacity duration-500">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Proyecto Magnes</h1>
            <p class="text-gray-600 text-center text-sm mb-6">Crea y gestiona equipos con ayuda de evidencia científica</p>
            <div class="flex flex-col items-center">
                <button id="startBtn" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">Comenzar</button>
            </div>
        </div>

        <!-- Sección de Opciones -->
        <div id="options-section" class="hidden transition-opacity duration-500">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Elige el método de creación</h1>
            <p class="text-gray-600 text-center mb-6">¿Quieres generar miembros automáticamente o añadirlos manualmente?</p>
            <div class="flex flex-col items-center space-y-4">
                <button id="autoModeBtn" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">Generar automáticamente</button>
                <button id="manualModeBtn" class="w-full bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-gray-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-gray-400 focus:ring-opacity-50">Añadir manualmente
